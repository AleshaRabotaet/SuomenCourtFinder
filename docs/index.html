<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Court Finder — Espoo &amp; Helsinki</title>
<meta name="description" content="Free tennis court slots at private halls in Espoo and Helsinki, updated every 30 minutes.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%BE</text></svg>">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Court Finder">
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #1d6f42;
    --accent-contrast: #ffffff;
    --chip-bg: #eaf6ee;
    --chip-border: #bfe3cc;
    --warn-bg: #fff4e5;
    --warn-border: #f3c98b;
    --warn-text: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1d2026;
      --text: #eceef1;
      --muted: #9aa1ac;
      --border: #2c3038;
      --accent: #4cbb7d;
      --accent-contrast: #0b1210;
      --chip-bg: #16311f;
      --chip-border: #2a5c3a;
      --warn-bg: #3a2c10;
      --warn-border: #6b4f14;
      --warn-text: #f0c877;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, select, button {
    font-family: inherit;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  header {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 2px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 12px 40px;
    padding-left: calc(12px + env(safe-area-inset-left, 0px));
    padding-right: calc(12px + env(safe-area-inset-right, 0px));
  }
  .dates-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dates {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 auto;
    min-width: 0;
  }
  .date-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .date-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
  }
  .date-btn:active {
    opacity: 0.7;
  }
  .date-input {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    border-radius: 999px;
    min-height: 44px;
    padding: 10px 14px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 16px;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
  }
  .filters label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }
  .filters select {
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 44px;
    padding: 8px 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 16px;
  }
  .filter-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--muted);
  }
  .venue-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .venue-toggle {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    font-size: 0.78rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--muted);
    cursor: pointer;
  }
  .venue-toggle.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .venue-toggle:active {
    opacity: 0.7;
  }
  .venue-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .venue-card h2 {
    font-size: 1rem;
    margin: 0 0 2px;
  }
  .venue-address {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 10px;
  }
  .slots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .slot {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 10px 14px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  .slot:active {
    opacity: 0.7;
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 8px 0;
  }
  .warning {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.82rem;
    margin-bottom: 14px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 20px 12px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(12px + env(safe-area-inset-left, 0px));
    padding-right: calc(12px + env(safe-area-inset-right, 0px));
  }
  footer a { color: inherit; }
  footer .kofi-link {
    display: inline-block;
    margin-top: 8px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  @media (max-width: 480px) {
    header {
      padding: 12px 14px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      padding-left: calc(14px + env(safe-area-inset-left, 0px));
      padding-right: calc(14px + env(safe-area-inset-right, 0px));
    }
    h1 { font-size: 1.05rem; }
    .subtitle { font-size: 0.78rem; }
    main {
      padding: 10px 10px 32px;
      padding-left: calc(10px + env(safe-area-inset-left, 0px));
      padding-right: calc(10px + env(safe-area-inset-right, 0px));
    }
    .dates-row {
      flex-direction: column;
      align-items: stretch;
    }
    .date-input { width: 100%; }
    .filters {
      font-size: 0.8rem;
      gap: 8px 12px;
    }
    .venue-card { padding: 12px; }
    .venue-card h2 { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🎾 Tennis Court Finder</h1>
  <div class="subtitle" id="subtitle">Loading…</div>
</header>
<main>
  <div class="dates-row">
    <div class="dates" id="dates"></div>
    <input type="date" class="date-input" id="dateInput">
  </div>
  <div class="filters">
    <label>
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
      From <select id="fromTime"></select>
    </label>
    <label>
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
      To <select id="toTime"></select>
    </label>
    <label>
      <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></svg>
      Court <select id="courtType">
      <option value="all">All</option>
      <option value="indoor">Indoor</option>
      <option value="outdoor">Outdoor</option>
    </select></label>
  </div>
  <div class="venue-toggles" id="venueToggles"></div>
  <div id="warnings"></div>
  <div id="results"></div>
</main>
<footer>
  Availability refreshes every ~30 minutes and links out to each hall's own booking site to reserve.<br>
  Private halls only, Espoo &amp; Helsinki. Not affiliated with any venue listed.<br>
  <a class="kofi-link" href="https://ko-fi.com/alesharabotaet" target="_blank" rel="noopener">☕ Support this project on Ko-fi</a>
</footer>

<script>
(function () {
  const PREFS_KEY = "suomencourtfinder:prefs:v1";

  const state = {
    data: null,
    selectedDate: null,
    fromTime: "",
    toTime: "",
    fromTimeAuto: true,
    hiddenVenues: new Set(),
    courtType: "all",
  };

  function loadPrefs() {
    try {
      const raw = localStorage.getItem(PREFS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  function savePrefs() {
    try {
      localStorage.setItem(
        PREFS_KEY,
        JSON.stringify({
          fromTime: state.fromTime,
          fromTimeAuto: state.fromTimeAuto,
          toTime: state.toTime,
          hiddenVenues: [...state.hiddenVenues],
          courtType: state.courtType,
        })
      );
    } catch (err) {
      // localStorage unavailable (private mode, quota, etc.) - not fatal.
    }
  }

  function applyPrefs() {
    const prefs = loadPrefs();
    if (!prefs) return;
    if (typeof prefs.toTime === "string") state.toTime = prefs.toTime;
    if (typeof prefs.fromTimeAuto === "boolean") state.fromTimeAuto = prefs.fromTimeAuto;
    if (!state.fromTimeAuto && typeof prefs.fromTime === "string") state.fromTime = prefs.fromTime;
    if (Array.isArray(prefs.hiddenVenues)) state.hiddenVenues = new Set(prefs.hiddenVenues);
    if (typeof prefs.courtType === "string") state.courtType = prefs.courtType;
  }

  function minutesToTime(total) {
    const h = Math.floor(total / 60);
    const m = total % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function buildTimeOptions(selectEl) {
    selectEl.innerHTML = '<option value="">Any</option>';
    for (let total = 0; total < 24 * 60; total += 30) {
      const value = minutesToTime(total);
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = value;
      selectEl.appendChild(opt);
    }
  }

  function currentHelsinkiTime() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Helsinki",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    }).formatToParts(new Date());
    const h = parts.find((p) => p.type === "hour").value;
    const m = parts.find((p) => p.type === "minute").value;
    return `${h}:${m}`;
  }

  function currentHelsinkiDateISO() {
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Helsinki",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date());
    const y = parts.find((p) => p.type === "year").value;
    const m = parts.find((p) => p.type === "month").value;
    const d = parts.find((p) => p.type === "day").value;
    return `${y}-${m}-${d}`;
  }

  // Keeps the "From" filter at "now" on today and at "earliest" (no lower
  // bound) on any other day, unless the user has manually picked a value.
  function applyAutoFromTime() {
    if (!state.fromTimeAuto || !state.selectedDate) return;
    const isToday = state.selectedDate === currentHelsinkiDateISO();
    state.fromTime = isToday ? roundUpToStep(currentHelsinkiTime(), 30) : "";
    document.getElementById("fromTime").value = state.fromTime;
  }

  function roundUpToStep(hhmm, stepMinutes) {
    const total = timeToMinutes(hhmm);
    const rounded = Math.min(Math.ceil(total / stepMinutes) * stepMinutes, 23 * 60 + 30);
    return minutesToTime(rounded);
  }

  function fmtDateLabel(iso) {
    const d = new Date(iso + "T00:00:00");
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diffDays = Math.round((d - today) / 86400000);
    const weekday = d.toLocaleDateString("en-GB", { weekday: "short" });
    const dm = d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" });
    if (diffDays === 0) return "Today";
    if (diffDays === 1) return "Tomorrow";
    return `${weekday} ${dm}`;
  }

  function renderDates() {
    const dates = [...new Set(state.data.slots.map((s) => s.date))].sort();
    if (!state.selectedDate || !dates.includes(state.selectedDate)) {
      state.selectedDate = dates[0] || null;
    }
    applyAutoFromTime();
    const el = document.getElementById("dates");
    el.innerHTML = "";
    dates.forEach((date) => {
      const btn = document.createElement("button");
      btn.className = "date-btn" + (date === state.selectedDate ? " active" : "");
      btn.textContent = fmtDateLabel(date);
      btn.onclick = () => {
        state.selectedDate = date;
        render();
      };
      el.appendChild(btn);
    });

    const dateInput = document.getElementById("dateInput");
    if (dates.length) {
      dateInput.min = dates[0];
      dateInput.max = dates[dates.length - 1];
    }
    dateInput.value = state.selectedDate || "";
  }

  function renderVenueToggles() {
    const el = document.getElementById("venueToggles");
    el.innerHTML = "";
    state.data.venues.forEach((v) => {
      const btn = document.createElement("button");
      btn.className = "venue-toggle" + (state.hiddenVenues.has(v.name) ? "" : " active");
      btn.textContent = v.name.split(" (")[0];
      btn.onclick = () => {
        if (state.hiddenVenues.has(v.name)) state.hiddenVenues.delete(v.name);
        else state.hiddenVenues.add(v.name);
        savePrefs();
        render();
      };
      el.appendChild(btn);
    });
  }

  function renderWarnings() {
    const el = document.getElementById("warnings");
    const failed = state.data.venues.filter((v) => v.status !== "ok");
    if (failed.length === 0) {
      el.innerHTML = "";
      return;
    }
    el.innerHTML =
      '<div class="warning">⚠️ Could not update: ' +
      failed.map((v) => v.name).join(", ") +
      ". Other venues below are unaffected.</div>";
  }

  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function isOutdoorCourt(courtName) {
    return /massa|ulko/i.test(courtName);
  }

  // Deep-links the viewed date into the venue's own booking site so the
  // visitor lands on the same day they were looking at here, instead of
  // whatever the venue's site defaults to.
  function bookingUrlForDate(venue, date) {
    if (!venue.date_query_param || !date) return venue.booking_url;
    const sep = venue.booking_url.includes("?") ? "&" : "?";
    return (
      venue.booking_url +
      sep +
      encodeURIComponent(venue.date_query_param) +
      "=" +
      encodeURIComponent(date)
    );
  }

  function renderResults() {
    const el = document.getElementById("results");
    el.innerHTML = "";

    const fromMin = state.fromTime ? timeToMinutes(state.fromTime) : -1;
    const toMin = state.toTime ? timeToMinutes(state.toTime) : Infinity;

    let anyShown = false;

    state.data.venues
      .filter((v) => !state.hiddenVenues.has(v.name))
      .forEach((venue) => {
        const slots = state.data.slots.filter((s) => {
          if (s.venue !== venue.name || s.date !== state.selectedDate) return false;
          const startMin = timeToMinutes(s.start);
          if (startMin < fromMin || startMin > toMin) return false;
          if (state.courtType !== "all") {
            const outdoor = isOutdoorCourt(s.court);
            if (state.courtType === "outdoor" && !outdoor) return false;
            if (state.courtType === "indoor" && outdoor) return false;
          }
          return true;
        });

        const card = document.createElement("div");
        card.className = "venue-card";

        let html = `<h2>${venue.name}</h2><div class="venue-address">${venue.address}</div>`;

        if (venue.status !== "ok") {
          html += '<div class="empty">Data unavailable right now.</div>';
        } else if (slots.length === 0) {
          html += '<div class="empty">No free slots for this date/time.</div>';
        } else {
          anyShown = true;
          const sorted = [...slots].sort(
            (a, b) => a.start.localeCompare(b.start) || a.court.localeCompare(b.court)
          );
          html += '<div class="slots">';
          const bookingUrl = bookingUrlForDate(venue, state.selectedDate);
          sorted.forEach((s) => {
            html += `<a class="slot" href="${bookingUrl}" target="_blank" rel="noopener">${s.start}–${s.end} · ${s.court}</a>`;
          });
          html += "</div>";
        }

        card.innerHTML = html;
        el.appendChild(card);
      });

    if (!anyShown && state.data.venues.every((v) => v.status === "ok")) {
      // still show the per-venue "no slots" cards above; nothing extra needed
    }
  }

  function render() {
    renderDates();
    renderVenueToggles();
    renderWarnings();
    renderResults();
  }

  function renderSubtitle() {
    const generated = new Date(state.data.generated_at);
    const label = generated.toLocaleTimeString("en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Europe/Helsinki",
    });
    document.getElementById("subtitle").textContent =
      `Espoo & Helsinki, private halls · updated ${label} (Helsinki time)`;
  }

  const fromTimeEl = document.getElementById("fromTime");
  const toTimeEl = document.getElementById("toTime");
  const courtTypeEl = document.getElementById("courtType");
  buildTimeOptions(fromTimeEl);
  buildTimeOptions(toTimeEl);
  applyPrefs();
  toTimeEl.value = state.toTime;
  if (!state.fromTimeAuto) fromTimeEl.value = state.fromTime;
  courtTypeEl.value = state.courtType;

  fetch("./data/availability.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((data) => {
      state.data = data;
      renderSubtitle();
      render();
    })
    .catch((err) => {
      document.getElementById("subtitle").textContent = "Failed to load availability data.";
      document.getElementById("results").innerHTML =
        '<div class="warning">Could not load data/availability.json. Try refreshing in a bit.</div>';
      console.error(err);
    });

  fromTimeEl.addEventListener("change", (e) => {
    state.fromTime = e.target.value;
    state.fromTimeAuto = false;
    savePrefs();
    render();
  });
  toTimeEl.addEventListener("change", (e) => {
    state.toTime = e.target.value;
    savePrefs();
    render();
  });
  courtTypeEl.addEventListener("change", (e) => {
    state.courtType = e.target.value;
    savePrefs();
    render();
  });
  document.getElementById("dateInput").addEventListener("change", (e) => {
    if (!e.target.value) return;
    state.selectedDate = e.target.value;
    render();
  });
})();
</script>
</body>
</html>
